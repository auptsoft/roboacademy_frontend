server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pyodide runtime for Python lessons. nginx's default mime.types has no entry for .mjs and
    # browsers refuse to import a module served as application/octet-stream.
    location /pyodide/ {
        types {
            text/javascript mjs;
            application/wasm wasm;
            application/zip zip;
            application/json json;
        }
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
