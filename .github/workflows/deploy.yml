name: Build and deploy

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: Dockerfile.web
          - app: admin
            dockerfile: Dockerfile.admin
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          envs: GITHUB_RUN_NUMBER
          script: |
            cd ~/container_configs/roboacademy_frontend
            sed -i "s#^WEB_IMAGE=.*#WEB_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/web:${{ github.run_number }}#" .env.prod
            sed -i "s#^ADMIN_IMAGE=.*#ADMIN_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/admin:${{ github.run_number }}#" .env.prod
            docker compose --env-file .env.prod -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose --env-file .env.prod -f docker-compose.prod.yml --env-file .env.prod up -d
            docker image prune -f
